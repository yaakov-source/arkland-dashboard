<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#08080b" />
  <title>Private dashboard · Hai Creative</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2308080b'/%3E%3Cpath d='M7 22l6-13 7 4-3 10z' fill='none' stroke='%23a88bff' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M20 13l6 3-2 9-7-2' fill='none' stroke='%23fb0001' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preload" href="dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.is-locked > *:not(#gate):not(svg){visibility:hidden}
    #gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;align-items:safe center;overflow-y:auto;padding:24px;background:radial-gradient(120% 80% at 70% 0%,#1a1430 0%,#08080b 60%);font-family:"DM Sans Variable","DM Sans",system-ui,sans-serif;color:#f4efff}
    body:not(.is-locked) #gate{display:none}
    #gate form{width:min(380px,100%);padding:32px 28px;border-radius:24px;border:1px solid rgba(168,139,255,.28);background:rgba(20,17,30,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
    #gate .ey{font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:#a88bff;margin:0 0 14px}
    #gate h1{font-size:28px;line-height:1.1;font-weight:500;letter-spacing:-.02em;margin:0 0 22px}
    #gate label{display:block;font-size:13px;color:#b9b2cc;margin:14px 0 6px}
    #gate input{width:100%;box-sizing:border-box;height:46px;padding:0 16px;border-radius:999px;border:1px solid rgba(244,239,255,.16);background:#0f0d16;color:#f4efff;font:inherit;font-size:16px;outline:none}
    #gate input:focus{border-color:#a88bff;box-shadow:0 0 0 3px rgba(168,139,255,.22)}
    #gate button{margin-top:22px;width:100%;height:48px;border:0;border-radius:999px;background:#fb0001;color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
    #gate button[disabled]{opacity:.6;cursor:progress}
    #gate .brand{display:block;width:120px;height:40px;margin:0 0 22px;background:linear-gradient(90deg,#a88bff 18%,#c35eae);-webkit-mask:url(hai-wordmark-mask.png) left center/contain no-repeat;mask:url(hai-wordmark-mask.png) left center/contain no-repeat}
    #gate .err{min-height:20px;margin:12px 0 0;font-size:13px;color:#ff8a8b}
    #gate .hint{font-size:12px;line-height:1.5;color:#b9b2cc;margin:8px 0 0}
    #gate .password-field{position:relative}
    #gate .password-field input{padding-right:76px}
    #gate #gate-show{position:absolute;right:8px;top:5px;width:60px;height:36px;margin:0;background:transparent;color:#d7c8ff;font-size:12px;border-radius:999px}
    #gate #gate-show:focus-visible{outline:2px solid #a88bff;outline-offset:1px}
  </style>
</head>
<body id="top" class="is-locked">
  <div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-h">
    <form autocomplete="on" method="post">
      <span class="brand" role="img" aria-label="Hai Creative"></span>
      <p class="ey">Private dashboard</p>
      <h1 id="gate-h">Sign in to view</h1>
      <label for="gate-u">Username</label>
      <input id="gate-u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required />
      <label for="gate-p">Password</label>
      <div class="password-field"><input id="gate-p" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" required /><button id="gate-show" type="button" aria-label="Show password" aria-pressed="false" aria-controls="gate-p">Show</button></div>
      <button class="gate-submit" type="submit" disabled>View dashboard</button>
      <noscript><p class="hint">Enable JavaScript to sign in.</p></noscript>
      <p class="err" role="alert" aria-live="polite"></p>
    </form>
  </div>
  <a class="skip" href="#main">Skip to content</a>
  <header class="bar">
    <div class="bar__in">
      <a class="lockup" href="#top" aria-label="Back to top">
        <span class="wordmark" role="img" aria-label="Hai Creative"></span>
        <span class="lockup__rule" aria-hidden="true"></span>
        <span class="lockup__client"><small>Private</small><b>Dashboard</b></span>
      </a>
      <nav aria-label="Sections" id="nav"></nav>
      <span class="chip chip--lock" data-s="private">Private</span>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="foot" id="foot"></footer>
  <div class="dock" id="dock" aria-hidden="true"></div>
  <script src="data.enc.js?v=mwy00rkp"></script>
  <script src="gate.js?v=mwy00rkp"></script>
</body>
</html>
